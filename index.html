<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牵机 · 实验模拟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    background: #0a0f0a;
    color: #c8d8c0;
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    overflow: hidden;
  }

  #game {
    max-width: 820px;
    width: 100%;
    background: linear-gradient(180deg, #0f1a0f 0%, #0a120a 100%);
    border: 1px solid #2a4a2a;
    border-radius: 6px;
    padding: 20px;
    box-shadow: 0 0 60px rgba(40, 120, 40, 0.1);
    position: relative;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #1a3a1a;
  }

  .title {
    font-size: 18px;
    letter-spacing: 6px;
    color: #7ab87a;
    text-shadow: 0 0 20px rgba(100, 200, 100, 0.3);
  }

  .hud {
    font-size: 12px;
    color: #5a7a5a;
    display: flex;
    gap: 16px;
  }

  .hud span { color: #8ab88a; }

  .stage {
    position: relative;
    min-height: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .instructions {
    font-size: 13px;
    color: #6a8a6a;
    text-align: center;
    margin-bottom: 14px;
    line-height: 1.8;
    max-width: 620px;
  }

  .instructions em {
    color: #a8d8a0;
    font-style: normal;
  }

  .feedback {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #8ab88a;
    background: rgba(10, 30, 10, 0.95);
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid #2a5a2a;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }

  .feedback.show { opacity: 1; }

  /* ===== 第一关：矿洞探索 ===== */
  #caveMap {
    width: 100%;
    height: 380px;
    background: radial-gradient(ellipse at 50% 40%, #1a2a1a 0%, #060c06 75%);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    border: 1px solid #1a3a1a;
    cursor: crosshair;
  }

  .light {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120, 180, 120, 0.18) 0%, transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s;
    z-index: 1;
  }

  .light.dim {
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, rgba(120, 180, 120, 0.08) 0%, transparent 70%);
  }

  .rock {
    position: absolute;
    color: #2a3a2a;
    font-size: 40px;
    pointer-events: none;
    z-index: 0;
  }

  .vine {
    position: absolute;
    width: 60px;
    height: 60px;
    cursor: pointer;
    transition: transform 0.3s, opacity 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    z-index: 2;
  }

  .vine:hover { transform: scale(1.15); }

  .vine.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.3);
  }

  .vine.collected { opacity: 0.15; pointer-events: none; }

  .explore-hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #4a6a4a;
    background: rgba(10, 20, 10, 0.85);
    padding: 6px 16px;
    border-radius: 16px;
    z-index: 5;
    text-align: center;
    white-space: nowrap;
  }

  .battery {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 120px;
    height: 10px;
    background: rgba(20, 40, 20, 0.8);
    border: 1px solid #2a5a2a;
    border-radius: 5px;
    overflow: hidden;
    z-index: 5;
  }

  .battery-fill {
    height: 100%;
    background: linear-gradient(90deg, #4a8a4a, #8ad88a);
    width: 100%;
    transition: width 0.2s;
  }

  .battery-fill.low {
    background: linear-gradient(90deg, #8a4a4a, #d88a8a);
  }

  .timer {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 13px;
    color: #6a9a6a;
    background: rgba(10, 20, 10, 0.85);
    padding: 4px 12px;
    border-radius: 12px;
    z-index: 5;
    font-family: "Courier New", monospace;
  }

  .timer.warn { color: #d88a8a; }

  /* ===== 第二关：采集 ===== */
  #cave {
    width: 100%;
    height: 360px;
    background: radial-gradient(ellipse at 50% 30%, #1a2a1a 0%, #0a120a 70%);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
    border: 1px solid #1a3a1a;
  }

  .vine-collect {
    position: absolute;
    width: 60px;
    height: 60px;
    cursor: pointer;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .vine-collect:hover { transform: scale(1.2); }

  .vine-collect.target::after {
    content: '';
    position: absolute;
    inset: -6px;
    border: 2px dashed #4a8a4a;
    border-radius: 50%;
    animation: pulse 1.2s infinite;
  }

  .vine-collect.collected { opacity: 0.15; pointer-events: none; }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* ===== 第三关：仪器 ===== */
  .machine-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
  }

  .machine {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .machine-btn {
    background: rgba(20, 50, 20, 0.6);
    border: 1px solid #2a5a2a;
    color: #a8c8a0;
    font-family: inherit;
    font-size: 13px;
    padding: 14px 20px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.6;
  }

  .machine-btn:hover {
    background: rgba(40, 90, 40, 0.6);
    border-color: #4a8a4a;
    color: #d0e8c8;
  }

  .machine-btn.selected {
    background: rgba(60, 120, 60, 0.5);
    border-color: #6aba6a;
    box-shadow: 0 0 16px rgba(100, 200, 100, 0.3);
  }

  .screen {
    width: 100%;
    max-width: 540px;
    min-height: 150px;
    background: #060c06;
    border: 1px solid #1a3a1a;
    border-radius: 4px;
    padding: 16px;
    font-family: "Courier New", monospace;
    font-size: 12px;
    color: #4a8a4a;
    line-height: 1.8;
    white-space: pre-wrap;
    position: relative;
    overflow: hidden;
  }

  .screen .highlight { color: #8ab88a; }
  .screen .warn { color: #b85a5a; }
  .screen .ok { color: #7ab87a; }

  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0, 30, 0, 0.15) 2px, rgba(0, 30, 0, 0.15) 4px
    );
    pointer-events: none;
  }

  /* ===== 第四关：拖动倒液 ===== */
  .pour-area {
    display: flex;
    align-items: flex-end;
    gap: 60px;
    justify-content: center;
    height: 260px;
    position: relative;
    width: 100%;
    max-width: 600px;
  }

  .beaker {
    width: 110px;
    height: 150px;
    border: 2px solid #2a5a2a;
    border-top: none;
    border-radius: 0 0 14px 14px;
    position: relative;
    background: rgba(10, 30, 10, 0.4);
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    flex-shrink: 0;
  }

  .beaker.draggable {
    cursor: grab;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .beaker.draggable:hover {
    box-shadow: 0 0 24px rgba(100, 200, 100, 0.3);
    transform: translateY(-4px);
  }

  .beaker.draggable.dragging {
    cursor: grabbing;
    z-index: 50;
  }

  .beaker-label {
    position: absolute;
    bottom: 4px;
    font-size: 10px;
    color: #6a9a6a;
    z-index: 3;
    text-shadow: 0 0 6px #0a120a;
  }

  .liquid {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    transition: height 0.3s;
  }

  .liquid.qianji { background: rgba(80, 140, 80, 0.6); }
  .liquid.huanglian { background: rgba(180, 160, 60, 0.6); }
  .liquid.mixed { background: rgba(180, 60, 60, 0.6); }

  .pour-target.highlight {
    box-shadow: 0 0 30px rgba(100, 200, 100, 0.5);
    border-color: #6aba6a;
  }

  .slider-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
  }

  .slider-group input[type="range"] {
    width: 300px;
    accent-color: #4a8a4a;
  }

  .slider-label {
    font-size: 13px;
    color: #8ab88a;
  }

  .ratio-display {
    font-size: 15px;
    color: #a8d8a0;
    letter-spacing: 1px;
  }

  /* ===== 第五关：细胞 ===== */
  #petri {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, #0d1a0d 0%, #060c06 80%);
    border: 3px solid #2a4a2a;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(20, 60, 20, 0.5);
  }

  .cell {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #4a8a4a;
    box-shadow: 0 0 6px rgba(80, 180, 80, 0.6);
    transition: all 0.4s;
  }

  .cell.dead {
    background: #3a2a2a;
    box-shadow: none;
    transform: scale(0.4);
    opacity: 0.3;
  }

  /* ===== 通用按钮 ===== */
  .action-btn {
    background: rgba(30, 70, 30, 0.6);
    border: 1px solid #3a6a3a;
    color: #a8c8a0;
    font-family: inherit;
    font-size: 14px;
    padding: 12px 32px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    letter-spacing: 2px;
    margin-top: 14px;
  }

  .action-btn:hover {
    background: rgba(50, 100, 50, 0.7);
    border-color: #5a9a5a;
    color: #d0e8c8;
    box-shadow: 0 0 20px rgba(80, 180, 80, 0.2);
  }

  .action-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ===== 结局 ===== */
  .ending-box {
    text-align: center;
    padding: 20px;
  }

  .ending-title {
    font-size: 24px;
    letter-spacing: 8px;
    margin-bottom: 16px;
  }

  .ending-good { color: #7ab87a; text-shadow: 0 0 24px rgba(100,200,100,0.4); }
  .ending-bad { color: #b85a5a; text-shadow: 0 0 24px rgba(200,80,80,0.4); }
  .ending-neutral { color: #b8a86a; text-shadow: 0 0 24px rgba(200,180,80,0.4); }

  .ending-text {
    font-size: 14px;
    line-height: 2;
    color: #8aa888;
    margin-bottom: 20px;
    text-align: left;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .score-line {
    font-size: 13px;
    color: #5a8a5a;
    margin-bottom: 20px;
  }

  .score-line span { color: #8ab88a; }

  .drag-hint {
    font-size: 12px;
    color: #4a6a4a;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="game">
  <div class="header">
    <div class="title">牵 机</div>
    <div class="hud">
      进度 <span id="hudProgress">1/6</span> ·
      药性值 <span id="hudHerb">0</span> ·
      准确率 <span id="hudAcc">100%</span>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="feedback" id="globalFeedback"></div>
</div>

<script>
// ================= 全局状态 =================
const state = {
  stage: 1,
  herb: 0,
  correct: 0,
  total: 0,
  collected: [],
  targetVines: [],
  geneFound: false,
  ratio: 3.8,
  cellsAlive: 60,
  pourDone: false,
  choice: null
};

const stageEl = document.getElementById("stage");
const feedbackEl = document.getElementById("globalFeedback");

function updateHUD() {
  document.getElementById("hudProgress").textContent = state.stage + "/6";
  document.getElementById("hudHerb").textContent = state.herb;
  const acc = state.total === 0 ? 100 : Math.round(state.correct / state.total * 100);
  document.getElementById("hudAcc").textContent = acc + "%";
}

function feedback(msg, isWarn) {
  feedbackEl.textContent = msg;
  feedbackEl.style.color = isWarn ? "#d88a8a" : "#8ab88a";
  feedbackEl.style.borderColor = isWarn ? "#5a2a2a" : "#2a5a2a";
  feedbackEl.classList.add("show");
  clearTimeout(feedbackEl._t);
  feedbackEl._t = setTimeout(() => feedbackEl.classList.remove("show"), 1800);
}

// ================= 第一关：矿洞探索 =================
function renderStage1() {
  state.stage = 1;
  updateHUD();

  stageEl.innerHTML = `
    <div class="instructions">
      2088年，贵州黔南。你进入了一个喀斯特溶洞。<br>
      手电电量有限，移动会消耗电量。藤蔓被照到后会缩回石缝，要在 <em>4 秒内</em> 做决定。<br>
      洞里混着<em>忍冬藤</em>、<em>变异忍冬藤</em>和<em>牵机</em>。<br>
      <em>牵机：茎实心 · 乳白汁液 · 气味腥甜</em><br>
      <em>变异忍冬藤：茎实心 · 清水汁液 · 气味清苦（干扰项）</em><br>
      采集 <em>3 株牵机</em>。时间 <em>90 秒</em>。
    </div>
    <div id="caveMap">
      <div class="light" id="light"></div>
      <div class="battery"><div class="battery-fill" id="batteryFill"></div></div>
      <div class="timer" id="timer">90s</div>
      <div class="explore-hint" id="exploreHint">移动鼠标 · 手电照亮区域 · 点击采集</div>
    </div>
  `;

  const caveMap = document.getElementById("caveMap");
  const light = document.getElementById("light");
  const hint = document.getElementById("exploreHint");
  const batteryFill = document.getElementById("batteryFill");
  const timerEl = document.getElementById("timer");

  let battery = 100;
  let timeLeft = 90;
  let gameActive = true;
  let hintTimer = null;

  let lastMove = 0;
  caveMap.addEventListener("mousemove", (e) => {
    if (!gameActive) return;
    const rect = caveMap.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    light.style.left = x + "px";
    light.style.top = y + "px";

    const now = Date.now();
    if (now - lastMove > 100) {
      battery = Math.max(0, battery - 0.6);
      lastMove = now;
      batteryFill.style.width = battery + "%";
      if (battery < 30) batteryFill.classList.add("low");
      else batteryFill.classList.remove("low");
      if (battery <= 0) light.classList.add("dim");
      else light.classList.remove("dim");
    }
  });

  const timerInterval = setInterval(() => {
    if (!gameActive) return;
    timeLeft--;
    timerEl.textContent = timeLeft + "s";
    if (timeLeft <= 20) timerEl.classList.add("warn");
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      gameActive = false;
      state.herb -= 3;
      updateHUD();
      feedback("时间到。你没能集齐三株牵机。药性值 -3。", true);
      setTimeout(() => renderStage2(), 1500);
    }
  }, 1000);

  for (let i = 0; i < 10; i++) {
    const rock = document.createElement("div");
    rock.className = "rock";
    rock.textContent = "🪨";
    rock.style.left = (Math.random() * 92) + "%";
    rock.style.top = (Math.random() * 88) + "%";
    rock.style.opacity = 0.15 + Math.random() * 0.3;
    rock.style.fontSize = (30 + Math.random() * 25) + "px";
    caveMap.appendChild(rock);
  }

  const vineCount = 18;
  const qianjiCount = 3;
  const mutantCount = 5;
  const positions = [];

  for (let i = 0; i < vineCount; i++) {
    let x, y, ok, tries = 0;
    do {
      x = 25 + Math.random() * 730;
      y = 25 + Math.random() * 310;
      ok = positions.every(p => Math.hypot(p.x - x, p.y - y) > 65);
      tries++;
    } while (!ok && tries < 200);
    positions.push({ x, y });
  }

  const indices = [...Array(vineCount).keys()];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }

  const qianjiIndices = indices.slice(0, qianjiCount);
  const mutantIndices = indices.slice(qianjiCount, qianjiCount + mutantCount);

  state.targetVines = qianjiIndices;
  state.collected = [];

  function showHint(type) {
    clearTimeout(hintTimer);
    if (type === "qianji") {
      hint.innerHTML = `<span style="color:#8ad88a;">茎实心 · 断面渗出乳白汁液 · 气味腥甜</span>`;
    } else if (type === "mutant") {
      hint.innerHTML = `<span style="color:#b8a86a;">茎实心 · 断面渗出清水状汁液 · 气味清苦</span>`;
    } else {
      hint.innerHTML = `<span style="color:#6a8a6a;">茎空心有髓 · 无汁液 · 气味清苦</span>`;
    }
    hintTimer = setTimeout(() => {
      hint.textContent = "移动鼠标 · 手电照亮区域 · 点击采集";
    }, 2500);
  }

  positions.forEach((pos, i) => {
    const isQianji = qianjiIndices.includes(i);
    const isMutant = mutantIndices.includes(i);
    const vine = document.createElement("div");
    vine.className = "vine";
    vine.style.left = pos.x + "px";
    vine.style.top = pos.y + "px";
    vine.textContent = "🌿";
    vine.dataset.index = i;
    vine.dataset.type = isQianji ? "qianji" : (isMutant ? "mutant" : "normal");
    vine.dataset.hideTimer = null;

    vine.addEventListener("mouseenter", () => {
      if (!gameActive) return;
      if (vine.classList.contains("collected") || vine.classList.contains("hidden")) return;

      showHint(vine.dataset.type);

      clearTimeout(vine.dataset.hideTimer);
      vine.dataset.hideTimer = setTimeout(() => {
        if (!vine.classList.contains("collected") && gameActive) {
          vine.classList.add("hidden");
          feedback("藤蔓缩回石缝了。重新找。", true);
          clearTimeout(hintTimer);
          hintTimer = setTimeout(() => {
            hint.textContent = "移动鼠标 · 手电照亮区域 · 点击采集";
          }, 1500);
        }
      }, 4000);
    });

    vine.addEventListener("mouseleave", () => {
      if (vine.dataset.hideTimer) {
        clearTimeout(vine.dataset.hideTimer);
        vine.dataset.hideTimer = null;
      }
    });

    vine.onclick = () => {
      if (!gameActive) return;
      if (vine.dataset.hideTimer) {
        clearTimeout(vine.dataset.hideTimer);
        vine.dataset.hideTimer = null;
      }
      if (vine.classList.contains("hidden")) return;
      collectVineHard(vine, vine.dataset.type, () => {
        gameActive = false;
        clearInterval(timerInterval);
        setTimeout(() => renderStage2(), 900);
      });
    };

    caveMap.appendChild(vine);
  });

  window._cleanupStage1 = () => {
    gameActive = false;
    clearInterval(timerInterval);
    clearTimeout(hintTimer);
  };
}

function collectVineHard(el, type, onComplete) {
  if (el.classList.contains("collected")) return;

  state.total++;
  if (type === "qianji") {
    state.correct++;
    state.herb += 3;
    state.collected.push(el.dataset.index);
    el.textContent = "✦";
    el.style.color = "#8ad88a";
    feedback("牵机 +1 —— 确认：茎实心，乳白汁液，腥甜。");
  } else if (type === "mutant") {
    state.herb -= 1;
    feedback("变异忍冬藤。茎实心，但汁液是清水状，气味清苦。不是它。", true);
  } else {
    state.herb -= 1;
    feedback("忍冬藤。茎空心有髓，无汁液。不是它。", true);
  }
  el.classList.add("collected");
  el.classList.add("hidden");
  updateHUD();

  if (state.collected.length >= 3) {
    feedback("三株牵机已采集。样本封存。");
    if (onComplete) onComplete();
  }
}

// ================= 第二关：采集 =================
function renderStage2() {
  if (window._cleanupStage1) window._cleanupStage1();
  state.stage = 2;
  updateHUD();

  stageEl.innerHTML = `
    <div class="instructions">
      标记了生长点，现在要精准采集。<br>
      石壁上混着<em>忍冬藤</em>和<em>牵机</em>。<br>
      <em>牵机特征：茎实心，断面渗出乳白色汁液。</em><br>
      点击采集 <em>3 株牵机</em>。点错忍冬藤会扣药性值。
    </div>
    <div id="cave"></div>
  `;

  const cave = document.getElementById("cave");
  const vineCount = 16;
  const targetCount = 3;
  const positions = [];

  for (let i = 0; i < vineCount; i++) {
    let x, y, ok, tries = 0;
    do {
      x = 20 + Math.random() * 700;
      y = 20 + Math.random() * 280;
      ok = positions.every(p => Math.hypot(p.x - x, p.y - y) > 65);
      tries++;
    } while (!ok && tries < 120);
    positions.push({ x, y });
  }

  const indices = [...Array(vineCount).keys()];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  state.targetVines = indices.slice(0, targetCount);
  state.collected = [];

  positions.forEach((pos, i) => {
    const isTarget = state.targetVines.includes(i);
    const vine = document.createElement("div");
    vine.className = "vine-collect" + (isTarget ? " target" : "");
    vine.style.left = pos.x + "px";
    vine.style.top = pos.y + "px";
    vine.textContent = "🌿";
    vine.dataset.index = i;
    vine.dataset.target = isTarget;
    vine.onclick = () => collectVine(vine, isTarget);
    cave.appendChild(vine);
  });
}

function collectVine(el, isTarget) {
  if (el.classList.contains("collected")) return;

  state.total++;
  if (isTarget) {
    state.correct++;
    state.herb += 2;
    state.collected.push(el.dataset.index);
    el.textContent = "✦";
    el.style.color = "#8ad88a";
    feedback("牵机 +1 —— 茎实心，汁液乳白，确认。");
  } else {
    state.herb -= 1;
    feedback("忍冬藤。茎空心，有髓。不是它。", true);
  }
  el.classList.add("collected");
  updateHUD();

  if (state.collected.length >= 3) {
    setTimeout(() => {
      feedback("采集完成。样本已封存。");
      setTimeout(() => renderStage3(), 900);
    }, 600);
  }
}

// ================= 第三关：成分比对 =================

        <button class="machine-btn" data-m="ms">质谱<br><span style="font-size:11px;color:#5a8a5a;">成分分子量</span></button>

}

function runMachine(type) {

> 提取DNA... 完成<br>

<span class="ok">> 结论：该物种基因组中存在一段被锁定的未知序列。</span>`;

<span class="warn">> 无异常。</span><br><br>

// ================= 第四关：拖动倒液 =================
function renderStage4() {
  state.stage = 4;
  updateHUD();

  stageEl.innerHTML = `
    <div class="instructions">
      你给这种东西取了个名字：<em>牵机</em>。<br><br>
      现在，你要激活它。<br>
      <em>拖动左边的牵机烧杯，把液体倒进中间的混合烧杯。</em><br>
      然后加入黄连提取物（苦寒，清热燥湿，泻火解毒）。<br>
      <em>提示：比例接近 1:4。</em>
    </div>
    <div class="pour-area">
      <div class="beaker draggable" id="beakerQ">
        <div class="liquid qianji" id="liqQ" style="height:70%;"></div>
        <div class="beaker-label">牵机</div>
      </div>
      <div class="beaker pour-target" id="beakerMix">
        <div class="liquid mixed" id="liqMix" style="height:0%;"></div>
        <div class="beaker-label">混合</div>
      </div>
      <div class="beaker" id="beakerH">
        <div class="liquid huanglian" id="liqH" style="height:70%;"></div>
        <div class="beaker-label">黄连</div>
      </div>
    </div>
    <div class="slider-group">
      <div class="slider-label">黄连比例：牵机 1 : 黄连 <span class="ratio-display" id="ratioVal">3.8</span></div>
      <input type="range" id="ratioSlider" min="1" max="10" step="0.1" value="3.8">
    </div>
    <div class="drag-hint">先拖动牵机烧杯倒入混合烧杯，再调节比例，最后点混合</div>
    <button class="action-btn" id="mixBtn" onclick="doMix()" disabled>混 合</button>
  `;

  const beakerQ = document.getElementById("beakerQ");
  const beakerMix = document.getElementById("beakerMix");
  const slider = document.getElementById("ratioSlider");
  const liqQ = document.getElementById("liqQ");
  const liqMix = document.getElementById("liqMix");

  let dragging = false;
  let startX, startY;

  beakerQ.addEventListener("mousedown", (e) => {
    if (state.pourDone) return;
    dragging = true;
    beakerQ.classList.add("dragging");
    startX = e.clientX;
    startY = e.clientY;
    e.preventDefault();
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    beakerQ.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.min(dx * 0.15, 45)}deg)`;

    const mixRect = beakerMix.getBoundingClientRect();
    const qRect = beakerQ.getBoundingClientRect();
    const overlap = !(qRect.right < mixRect.left || qRect.left > mixRect.right ||
                      qRect.bottom < mixRect.top || qRect.top > mixRect.bottom);
    if (overlap) {
      beakerMix.classList.add("highlight");
    } else {
      beakerMix.classList.remove("highlight");
    }
  });

  document.addEventListener("mouseup", (e) => {
    if (!dragging) return;
    dragging = false;
    beakerQ.classList.remove("dragging");

    const mixRect = beakerMix.getBoundingClientRect();
    const qRect = beakerQ.getBoundingClientRect();
    const overlap = !(qRect.right < mixRect.left || qRect.left > mixRect.right ||
                      qRect.bottom < mixRect.top || qRect.top > mixRect.bottom);

    if (overlap) {
      state.pourDone = true;
      liqQ.style.height = "0%";
      liqMix.style.height = "40%";
      beakerQ.style.opacity = "0.3";
      beakerQ.style.pointerEvents = "none";
      beakerQ.style.transform = "none";
      beakerMix.classList.remove("highlight");
      feedback("牵机提取物已倒入。调节黄连比例。");
      checkMixReady();
    } else {
      beakerQ.style.transition = "transform 0.3s";
      beakerQ.style.transform = "translate(0, 0)";
      setTimeout(() => { beakerQ.style.transition = ""; }, 300);
      beakerMix.classList.remove("highlight");
    }
  });

  slider.oninput = () => {
    state.ratio = parseFloat(slider.value);
    document.getElementById("ratioVal").textContent = state.ratio.toFixed(1);
    if (state.pourDone) {
      liqMix.style.height = Math.min(80, 20 + state.ratio * 6) + "%";
    }
    checkMixReady();
  };

  function checkMixReady() {
    const btn = document.getElementById("mixBtn");
    if (state.pourDone) {
      btn.disabled = false;
    }
  }
}

function doMix() {
  if (!state.pourDone) return;

  const diff = Math.abs(state.ratio - 3.8);
  const liqMix = document.getElementById("liqMix");

  if (diff < 0.05) {
    state.total++;
    state.correct++;
    state.herb += 3;
    updateHUD();
    liqMix.style.height = "75%";
    liqMix.style.background = "rgba(180, 60, 60, 0.7)";
    feedback("激活成功。牵机素生成了。");
    setTimeout(() => renderStage5(), 1100);
  } else if (diff < 0.5) {
    feedback("接近了。前体部分激活，但不稳定。再调。", true);
    liqMix.style.background = "rgba(180, 120, 60, 0.5)";
  } else {
    state.total++;
    state.herb -= 1;
    updateHUD();
    liqMix.style.background = "rgba(80, 80, 80, 0.3)";
    feedback("没有反应。比例不对。", true);
  }
}

// ================= 第五关：细胞实验 =================
function renderStage5() {
  state.stage = 5;
  updateHUD();

  stageEl.innerHTML = `
    <div class="instructions">
      微量牵机素滴入培养皿。<br>
      透过显微镜，观察细胞变化。
    </div>
    <div id="petri"></div>
    <button class="action-btn" id="dropBtn" onclick="dropPoison()">滴 入 牵 机 素</button>
  `;

  const petri = document.getElementById("petri");
  state.cellsAlive = 60;

  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 125;
    const x = 150 + Math.cos(angle) * r - 5;
    const y = 150 + Math.sin(angle) * r - 5;

    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.left = x + "px";
    cell.style.top = y + "px";
    petri.appendChild(cell);
  }
}

function dropPoison() {
  document.getElementById("dropBtn").disabled = true;
  const cells = document.querySelectorAll(".cell");
  let dead = 0;

  cells.forEach((c, i) => {
    setTimeout(() => {
      c.classList.add("dead");
      dead++;
      state.cellsAlive = 60 - dead;
      if (dead === 60) {
        state.total++;
        state.correct++;
        state.herb += 2;
        updateHUD();
        feedback("所有细胞死亡。无一存活。");
        setTimeout(renderStage6, 1300);
      }
    }, i * 30);
  });
}

        <span style="font-size:12px;color:#6a8a6a;">选一家出价最高的，一手交数据，一手拿钱。然后出境，换个身份，再也不碰这东西。</span>
      </button>

        <span style="font-size:12px;color:#6a8a6a;">把样本锁进冰柜，数据存三份，谁也不告诉。继续上班，继续交周报。等一个更好的时机。</span>
      </button>
      <button class="machine-btn" style="text-align:left;padding:18px 22px;line-height:1.8;border-color:#3a7a3a;" onclick="chooseEnding('D')">

        <span style="font-size:12px;color:#6a8a6a;">把牵机的全部数据、三家的收购证据，通过保密渠道上报。你不拿钱，不换身份，换一个体制内的位置。</span>
      </button>
    </div>
  `;
}

function chooseEnding(choice) {
  state.choice = choice;
  renderEnding();
}

    “你想要什么？”<br><br>
    你看着窗外2088年的城市夜景。霓虹广告牌上飘着中药品牌的全息投影。楼下的药店里，智能药柜正分拣着黄芪、当归、枸杞、金银花。<br><br>

    “行。”<br><br>

  } else if (state.choice === "B") {
    title = "自食其果";
    cls = "ending-bad";
    text = `你选了一家公司，谈好了价格。<br><br>

    但你不知道的是——你联系的这家，早就把你的通信记录卖给了另外两家。<br><br>
    你到机场的那天，安检把你单独带进一间小屋。屋里坐着三个人，分别来自神农源、中科生物、远洋医药。<br><br>
    他们看着你，像看一件已经属于他们的东西。<br><br>
    <em>——你卖了东西，也卖了你自己。</em>`;
  } else if (state.choice === "C") {
    title = "沉默的发现者";
    cls = "ending-neutral";
    text = `你合上笔记本，把样本锁进冰柜。<br><br>
    走廊里很安静。你的脚步声不紧不慢。<br><br>
    你在想一件事：这东西，值多少钱？<br><br>
    但你没有拨通那个电话。你把手机放回口袋，推了推眼镜，继续往前走。<br><br>
    2088年的冬天来了。你继续采集石斛、天麻、黄连。继续写论文，继续交周报。<br><br>
    有时候深夜在实验室，你会想起溶洞里那片藤。你给它取过名字，叫牵机。<br><br>
    你记得那句话：<em>此藤性极阴，生于不昼之地，藏于常见之形。</em><br><br>

function restart() {
  if (window._cleanupStage1) window._cleanupStage1();
  state.stage = 1;
  state.herb = 0;
  state.correct = 0;
  state.total = 0;
  state.collected = [];
  state.targetVines = [];
  state.geneFound = false;
  state.ratio = 3.8;
  state.cellsAlive = 60;
  state.pourDone = false;
  state.choice = null;
  renderStage1();
}

// ================= 启动 =================
renderStage1();
</script>
